name: Daily DART Disclosure Watcher

on:
  schedule:
    # 한국 시간 평일 16:30 (장 마감 직후) = UTC 07:30
    - cron: "30 7 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "조회 기준일 (YYYY-MM-DD, 비워두면 오늘)"
        required: false
        default: ""

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DART watcher
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python main.py --date "${{ inputs.date }}"
          else
            python main.py --quiet-when-empty
          fi
